{% extends 'base.html' %}
{% block content %}

<h2>Edit Student</h2>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Roll No</label>
        <input type="text" name="roll_no" class="form-control" value="{{ student.roll_no }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ student.email }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ student.phone }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Course</label>
        <select name="course" class="form-control" required>
            {% for course in courses %}
            <option value="{{ course.id }}" {% if course.id == student.course.id %}selected{% endif %}>
                {{ course.course_name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button type="submit" class="btn btn-success">Update Student</button>
    <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
