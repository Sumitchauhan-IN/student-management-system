{% extends 'base.html' %}
{% block content %}

<h2>Add Marks</h2>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Student</label>
        <select name="student" class="form-control" required>
            <option value="">-- Select Student --</option>
            {% for student in students %}
            <option value="{{ student.id }}">{{ student.name }} ({{ student.roll_no }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Subject</label>
        <input type="text" name="subject" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Marks Obtained</label>
        <input type="number" name="marks_obtained" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Total Marks</label>
        <input type="number" name="total_marks" class="form-control" value="100" required>
    </div>

    <button type="submit" class="btn btn-success">Save Marks</button>
    <a href="{% url 'marks_list' %}" class="btn btn-secondary">Cancel</a>
</form>

{% endblock %}
