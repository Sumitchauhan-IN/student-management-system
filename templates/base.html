<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container d-flex justify-content-between">
        <div>
            <a class="navbar-brand" href="{% url 'student_list' %}">Student Management System</a>
            {% if user.is_authenticated %}
            <a href="{% url 'student_list' %}" class="text-white me-3">Students</a>
            <a href="{% url 'marks_list' %}" class="text-white">Marks</a>
            <a href="{% url 'attendance_list' %}" class="text-white">Attendance</a>
            {% endif %}
        </div>
        {% if user.is_authenticated %}
        <div>
            <span class="text-white me-3">Welcome, {{ user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
        {% endif %}
    </div>
</nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
